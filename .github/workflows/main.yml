name: Find Project Files

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: สแกนหาไฟล์โปรเจกต์ทั้งหมด
        run: |
          echo "======================================"
          echo "🔍 รายชื่อไฟล์ .xcodeproj ที่พบในโปรเจกต์นี้:"
          find . -name "*.xcodeproj"
          echo "======================================"
          echo "🔍 รายชื่อไฟล์ .xcworkspace ที่พบในโปรเจกต์นี้:"
          find . -name "*.xcworkspace"
          echo "======================================"
          
          # บังคับหยุดการทำงาน เพื่อให้เราเข้าไปดู Log ได้ง่ายๆ
          exit 1
