name: Build Unsigned iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Find and Build App
        run: |
          # 1. ค้นหาไฟล์โปรเจกต์ .xcodeproj อัตโนมัติ
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "❌ Error: ไม่พบไฟล์ .xcodeproj ในโปรเจกต์นี้"
            exit 1
          fi
          
          echo "✅ พบไฟล์โปรเจกต์ที่: $PROJECT_PATH"
          
          # 2. ดึงชื่อไฟล์มาตั้งเป็นชื่อ Scheme
          PROJECT_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          echo "🔨 กำลังเริ่ม Build โปรเจกต์ชื่อ: $PROJECT_NAME"

          # 3. สั่ง Build โดยใช้ตัวแปรที่หามาได้
          xcodebuild clean build -project "$PROJECT_PATH" -scheme "$PROJECT_NAME" -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath build_output

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # ค้นหาไฟล์ .app ที่ถูกสร้างขึ้นและย้ายไปที่ Payload
          APP_PATH=$(find build_output/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            mv "$APP_PATH" Payload/
            zip -r app_unsigned.ipa Payload
            echo "✅ แพ็กไฟล์ .ipa สำเร็จ!"
          else
            echo "❌ Error: ไม่พบไฟล์ .app หลังจาก Build เสร็จ"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Digivice-App
          path: app_unsigned.ipa
