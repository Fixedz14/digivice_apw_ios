name: Build Unsigned watchOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build App (watchOS)
        run: |
          echo "🔨 กำลังเริ่ม Build โปรเจกต์ DTectorWatch สำหรับ Apple Watch..."
          # ชี้เป้าไปที่โฟลเดอร์ AppleWatch และระบุให้ Build สำหรับ watchOS โดยเฉพาะ
          xcodebuild clean build -project "AppleWatch/DTectorWatch.xcodeproj" -scheme "DTectorWatch" -configuration Release -destination "generic/platform=watchOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath build_output

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # เปลี่ยนจากการหาโฟลเดอร์ Release-iphoneos เป็น Release-watchos
          APP_PATH=$(find build_output/Build/Products/Release-watchos -name "*.app" | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            mv "$APP_PATH" Payload/
            zip -r app_unsigned.ipa Payload
            echo "✅ แพ็กไฟล์ .ipa สำเร็จพร้อมใช้งาน!"
          else
            echo "❌ Error: ไม่พบไฟล์ .app หลังจาก Build เสร็จ"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Digivice-App
          path: app_unsigned.ipa
